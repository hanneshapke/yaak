[package]
name = "yaak"
version = "0.1.0"
edition = "2021"
description = "Translate natural language to bash commands using an OpenAI-compatible LLM"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
dialoguer = "0.11"
dirs = "5"
toml = "0.8"
