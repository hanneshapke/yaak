[package]
name = "yaak"
version = "0.1.5"
edition = "2021"
description = "Translate natural language to bash commands using an OpenAI-compatible LLM"
license = "Apache-2.0"
homepage = "https://www.hanneshapke.com/yaak/"
repository = "https://github.com/hanneshapke/yaak"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
dialoguer = "0.11"
dirs = "5"
toml = "0.8"
clap_complete = "4.6.0"
chrono = { version = "0.4", features = ["serde"] }
rust-i18n = "3"
sys-locale = "0.3"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Hannes Hapke <hannes.hapke@gmail.com>"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/yaak", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/yaak/README.md", "644"],
  ["LICENSE", "usr/share/doc/yaak/copyright", "644"],
  ["target/completions/yaak.bash", "usr/share/bash-completion/completions/yaak", "644"],
  ["target/completions/_yaak", "usr/share/zsh/vendor-completions/_yaak", "644"],
  ["target/completions/yaak.fish", "usr/share/fish/vendor_completions.d/yaak.fish", "644"],
]
